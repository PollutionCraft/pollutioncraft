plugins {
    alias(libs.plugins.moddev)
}

base {
    archivesName = providers.gradleProperty('archives_base_name')
}

def coreMain = project(':core').sourceSets.main
def apiMain = project(':api').sourceSets.main

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

neoForge {
    version = libs.versions.neoforge.get()
    addModdingDependenciesTo sourceSets.gametest

    parchment {
        minecraftVersion = libs.versions.parchment.minecraft.get()
        mappingsVersion = libs.versions.parchment.mappings.get()
    }

    mods {
        pollutioncraft {
            sourceSet sourceSets.main
            sourceSet coreMain
            sourceSet apiMain
            sourceSet sourceSets.gametest
        }
    }

    runs {
        client {
            client()
            gameDirectory = layout.projectDirectory.dir('run/client')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'pollutioncraft'
        }
        server {
            server()
            gameDirectory = layout.projectDirectory.dir('run/server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            gameDirectory = layout.projectDirectory.dir('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'pollutioncraft'
        }
    }
}

dependencies {
    // Class directories, not jars: core/api never become published outputs (one-artifact rule).
    implementation coreMain.output
    implementation apiMain.output

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testImplementation libs.archunit.junit5
    testRuntimeOnly libs.junit.platform.launcher
}

// ---- Single jar ---------------------------------------------------------------------------------
def licenseFiles = layout.settingsDirectory.files('LICENSE', 'COPYING')

tasks.named('jar', Jar) {
    from coreMain.output
    from apiMain.output
    into('META-INF') { from licenseFiles }
}

java {
    withSourcesJar()
}

tasks.named('sourcesJar', Jar) {
    from coreMain.allSource
    from apiMain.allSource
    into('META-INF') { from licenseFiles }
}

def modProps = [
        mod_id: providers.gradleProperty('mod_id').get(),
        mod_name: providers.gradleProperty('mod_name').get(),
        mod_version: project.version.toString(),
        mod_license: providers.gradleProperty('mod_license').get(),
        mod_authors: providers.gradleProperty('mod_authors').get(),
        mod_description: providers.gradleProperty('mod_description').get(),
        minecraft_version_range: providers.gradleProperty('minecraft_version_range').get(),
        neo_version_range: providers.gradleProperty('neo_version_range').get(),
        loader_version_range: providers.gradleProperty('loader_version_range').get(),
]

tasks.named('processResources', ProcessResources) {
    inputs.properties(modProps)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(modProps)
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}

// ---- Dev loop: deploy into a local Prism instance (design §7) -----------------------------------
abstract class DeployToDevInstance extends DefaultTask {
    @InputFile
    abstract RegularFileProperty getJar()

    @Input
    @Optional
    abstract Property<String> getInstance()

    @TaskAction
    void deploy() {
        if (!instance.present || instance.get().isBlank()) {
            throw new GradleException('No dev instance configured. Set Gradle property pollutioncraft.devInstance ' +
                    '(in ~/.gradle/gradle.properties) or env var POLLUTIONCRAFT_DEV_INSTANCE to your Prism instance ' +
                    'directory. See README.md, section "Dev instance".')
        }
        def mods = new File(instance.get(), 'mods')
        if (!mods.isDirectory()) {
            throw new GradleException("Dev instance has no mods directory: ${mods}. " +
                    'Check pollutioncraft.devInstance / POLLUTIONCRAFT_DEV_INSTANCE. See README.md, section "Dev instance".')
        }
        def stale = mods.listFiles({ File f -> f.name.startsWith('pollutioncraft-') && f.name.endsWith('.jar') } as FileFilter)
        def locked = stale.findAll { !it.delete() }
        if (locked) {
            throw new GradleException("Could not delete old jar(s): ${locked*.name.join(', ')} in ${mods}. " +
                    'Close the game/Prism instance and retry; refusing to leave two versions in mods/.')
        }
        def target = new File(mods, jar.get().asFile.name)
        jar.get().asFile.withInputStream { i -> target.withOutputStream { o -> o << i } }
        logger.lifecycle("Deployed ${target}")
    }
}

tasks.register('deployToDevInstance', DeployToDevInstance) {
    group = 'pollutioncraft'
    description = 'Builds the jar and copies it into the local dev Prism instance.'
    jar = tasks.named('jar', Jar).flatMap { it.archiveFile }
    instance = providers.gradleProperty('pollutioncraft.devInstance')
            .orElse(providers.environmentVariable('POLLUTIONCRAFT_DEV_INSTANCE'))
    outputs.upToDateWhen { false }
}

// ---- GameTest run must prove its tests ran ------------------------------------------------------
// The vanilla server exits 0 when it crashes on startup (e.g. "No test functions were given!"), so the
// run is only accepted if its log shows the required tests passed. Test failures already exit non-zero.
def gameTestLog = layout.projectDirectory.file('run/gametest/logs/latest.log').asFile

tasks.named('runGameTestServer') {
    doFirst { gameTestLog.delete() }
    doLast {
        if (!gameTestLog.isFile() || !gameTestLog.text.contains('required tests passed')) {
            throw new GradleException("runGameTestServer exited normally but never reported 'required tests passed' " +
                    "(startup crash or no tests ran). See ${gameTestLog}.")
        }
    }
}
