name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: false

      # Unit tests and architecture checks (build), then headless GameTests. Both must exit 0.
      - name: Build and run GameTests
        run: ./gradlew build runGameTestServer

      - name: Upload test reports and GameTest logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-diagnostics
          if-no-files-found: ignore
          path: |
            */build/reports/tests/
            */build/test-results/
            mod/run/gametest/logs/
            mod/run/gametest/crash-reports/
