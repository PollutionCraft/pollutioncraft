abstract class VerifyNoTargetModsOnClasspath extends DefaultTask {
    /** Lines: configuration TAB kind(module|file) TAB descriptor TAB group TAB path. */
    @Input
    abstract ListProperty<String> getEntries()

    @Input
    abstract SetProperty<String> getAllowedGroups()

    /** Directories whose files are our own class/resource outputs. */
    @Input
    abstract ListProperty<String> getOwnOutputDirs()

    /** Directories where ModDevGradle writes the Minecraft/NeoForge artifacts it supplies. */
    @Input
    abstract ListProperty<String> getMdgArtifactDirs()

    @Input
    abstract Property<String> getProjectPath()

    @TaskAction
    void verify() {
        def offenders = new TreeSet<String>()
        entries.get().each { line ->
            def (config, kind, descriptor, group, path) = line.split('\t', -1) as List
            if (kind == 'module') {
                if (!allowedGroups.get().contains(group)) {
                    offenders << "${descriptor} (group '${group}' not on the allowlist) in ${projectPath.get()} ${config}".toString()
                }
            } else {
                def inside = { List<String> dirs -> dirs.any { path.startsWith(it) } }
                if (!inside(ownOutputDirs.get()) && !inside(mdgArtifactDirs.get())) {
                    offenders << "file ${path} (not our output, not MDG's artifact) in ${projectPath.get()} ${config}".toString()
                }
            }
        }
        if (offenders) {
            throw new GradleException("Disallowed dependencies on compile/test classpaths:\n  - " +
                    offenders.join('\n  - ') +
                    "\nRule: only internal, Minecraft-modding and generic Java dependencies on compile/test classpaths; ADR 0015. " +
                    'Target mods must never be build dependencies. To allow a new group, change allowedGroups in gradle/no-target-mods.gradle (reviewed by Heimdall).')
        }
    }
}

def collectEntries = { Configuration cfg ->
    // Capture the name only: configuration-cache serialisation cannot carry the Configuration itself.
    String cfgName = cfg.name
    def modules = cfg.incoming.resolutionResult.rootComponent.map { root ->
        def seen = new HashSet<Object>()
        def lines = []
        def walk
        walk = { component ->
            if (!seen.add(component.id)) return
            def id = component.id
            if (id instanceof ModuleComponentIdentifier) {
                lines << [cfgName, 'module', "${id.group}:${id.module}:${id.version}", id.group, ''].join('\t')
            }
            component.dependencies.each { dep ->
                if (dep instanceof ResolvedDependencyResult) walk(dep.selected)
            }
        }
        walk(root)
        lines
    }
    def files = cfg.incoming.artifacts.resolvedArtifacts.map { artifacts ->
        artifacts.findAll { !(it.id.componentIdentifier instanceof ModuleComponentIdentifier) &&
                !(it.id.componentIdentifier instanceof ProjectComponentIdentifier) }
                .collect { [cfgName, 'file', it.id.displayName, '', it.file.absolutePath].join('\t') }
    }
    [modules, files]
}

def verifyTask = tasks.register('verifyNoTargetModsOnClasspath', VerifyNoTargetModsOnClasspath) {
    group = 'verification'
    description = 'Fails if any compile/test classpath holds something other than internal, Minecraft-modding or generic Java dependencies (ADR 0015).'
    allowedGroups.addAll(project.ext.allowedGroups.collect { it.group })
    projectPath = project.path
    rootProject.subprojects.each { sub ->
        ownOutputDirs.add(sub.layout.buildDirectory.dir('classes').get().asFile.absolutePath)
        ownOutputDirs.add(sub.layout.buildDirectory.dir('resources').get().asFile.absolutePath)
        mdgArtifactDirs.add(sub.layout.buildDirectory.dir('moddev').get().asFile.absolutePath)
    }
}

// Every source set is covered, including ones added later: compile classpath for all, runtime for test-like ones.
pluginManager.withPlugin('java-library') {
    sourceSets.configureEach { ss ->
        def names = [ss.compileClasspathConfigurationName]
        if (ss.name != 'main') names << ss.runtimeClasspathConfigurationName
        names.each { n ->
            verifyTask.configure { t ->
                def cfg = configurations.getByName(n)
                // Resolving artifacts may need their producing tasks (MDG's generated Minecraft jars) to have run.
                t.dependsOn(cfg)
                def (modules, files) = collectEntries(cfg)
                t.entries.addAll(modules)
                t.entries.addAll(files)
            }
        }
    }
}

tasks.named('check') { dependsOn verifyTask }
